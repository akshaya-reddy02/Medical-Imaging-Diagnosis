
services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: medical-imaging-orthanc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    environment:
      ORTHANC_JSON: |
        {
          "Name": "Medical Imaging Diagnosis",
          "RemoteAccessAllowed": true,
          "AuthenticationEnabled": true,
          "RegisteredUsers": {
            "demo": "DemoOrthanc2026"
          },
          "StorageDirectory": "/var/lib/orthanc/db"
        }
    volumes:
      - orthanc_storage:/var/lib/orthanc/db

  backend:
    image: medical-imaging-api:latest
    container_name: medical-imaging-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: demo
      ORTHANC_PASSWORD: DemoOrthanc2026
    depends_on:
      - orthanc

volumes:
  orthanc_storage:
