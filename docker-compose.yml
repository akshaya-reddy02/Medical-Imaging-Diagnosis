
services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: medical-imaging-orthanc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    environment:
      ORTHANC_JSON: |
        {
          "Name": "Medical Imaging Diagnosis",
          "RemoteAccessAllowed": false,
          "AuthenticationEnabled": true,
          "RegisteredUsers": {
            "demo": "DemoOrthanc2026"
          },
          "StorageDirectory": "/var/lib/orthanc/db"
        }
    volumes:
      - orthanc_storage:/var/lib/orthanc/db

volumes:
  orthanc_storage:
